<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Viewer CFDI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1 class="header__title">XML Viewer CFDI (v2.2)</h1>
            <button id="theme-toggle" class="header__theme-btn" aria-label="Cambiar tema">
                <span class="theme-icon">🌙</span>
            </button>
        </header>

        <section class="input-area">
            <div class="input-area__drop-zone" id="drop-zone">
                <p class="drop-zone__text">Arrastra archivos XML aquí</p>
                <p class="drop-zone__sub">o</p>
                <label class="drop-zone__btn">
                    Seleccionar archivos
                    <input type="file" id="file-input" multiple accept=".xml" hidden>
                </label>
            </div>
            <div class="input-area__paste">
                <textarea id="paste-input" class="paste__textarea"
                    placeholder="Pega XML aquí..."></textarea>
                <button id="parse-btn" class="paste__btn">Parsear</button>
            </div>
        </section>

        <section class="toolbar" id="toolbar" hidden>
            <div class="toolbar__top">
                <span id="row-count" class="toolbar__count"></span>
                <div class="toolbar__columns">
                    <button id="columns-toggle" class="toolbar__btn">Filtrar Columnas</button>
                    <div id="columns-dropdown" class="toolbar__dropdown" hidden></div>
                </div>
            </div>
            <div class="toolbar__actions">
                <div class="toolbar__group toolbar__group--danger">
                    <button id="clear-all" class="toolbar__btn toolbar__btn--danger">Quitar Todo</button>
                    <button id="clear-selected" class="toolbar__btn toolbar__btn--danger" disabled>Quitar Seleccionados</button>
                </div>
                <div class="toolbar__group toolbar__group--primary">
                    <button id="export-all" class="toolbar__btn toolbar__btn--primary">Exportar Todo</button>
                    <button id="export-filtered" class="toolbar__btn toolbar__btn--primary">Exportar Filtrado</button>
                </div>
                <div class="toolbar__group toolbar__group--primary">
                    <button id="export-selected" class="toolbar__btn toolbar__btn--primary" disabled>Exportar Seleccionados</button>
                    <button id="print-selected" class="toolbar__btn toolbar__btn--primary" disabled>Imprimir Seleccionados</button>
                </div>
            </div>
        </section>

        <section id="grid-container" class="grid-container" hidden>
            <div class="grid-wrapper">
                <table id="data-grid" class="data-grid">
                    <thead id="grid-head"></thead>
                    <tbody id="grid-body"></tbody>
                </table>
            </div>
        </section>

        <footer id="status-bar" class="status-bar" hidden>
            <span id="status-text"></span>
        </footer>

        <div id="warnings" class="warnings" hidden></div>

        <dialog id="confirm-dialog" class="confirm-dialog">
            <p id="confirm-dialog-message" class="confirm-dialog__message"></p>
            <div class="confirm-dialog__actions">
                <button id="confirm-dialog-cancel" class="confirm-dialog__btn confirm-dialog__btn--cancel">Cancelar</button>
                <button id="confirm-dialog-ok" class="confirm-dialog__btn confirm-dialog__btn--ok">Confirmar</button>
            </div>
        </dialog>
    </div>

    <script src="lib/jspdf.umd.min.js"></script>
    <script src="lib/qrcode.min.js"></script>
    <script src="lib/jszip.min.js"></script>
    <script src="lib/xlsx.full.min.js"></script>
    <script type="module" src="js/app.js?v=2.3"></script>
</body>
</html>
