<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Viewer CFDI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1 class="header__title">XML Viewer CFDI (v2.2)</h1>
            <button id="theme-toggle" class="header__theme-btn" aria-label="Cambiar tema">
                <span class="theme-icon">🌙</span>
            </button>
        </header>

        <nav class="tabs" id="tabs">
            <button class="tabs__btn tabs__btn--active" data-tab="facturas">Facturas</button>
            <button class="tabs__btn" data-tab="pagos">Pagos</button>
        </nav>

        <section class="input-area">
            <div class="input-area__drop-zone" id="drop-zone">
                <p class="drop-zone__text">Arrastra archivos XML aquí</p>
                <p class="drop-zone__sub">o</p>
                <label class="drop-zone__btn">
                    Seleccionar archivos
                    <input type="file" id="file-input" multiple accept=".xml" hidden>
                </label>
            </div>
            <div class="input-area__paste">
                <textarea id="paste-input" class="paste__textarea"
                    placeholder="Pega XML aquí..."></textarea>
                <button id="parse-btn" class="paste__btn">Parsear</button>
            </div>
        </section>

        <!-- Facturas Tab -->
        <div id="tab-facturas" class="tab-content tab-content--active">
            <section class="toolbar" id="toolbar-facturas" hidden>
                <div class="toolbar__left">
                    <span id="row-count-facturas" class="toolbar__count"></span>
                    <div class="toolbar__columns">
                        <button id="columns-toggle-facturas" class="toolbar__btn">Filtrar Columnas</button>
                        <div id="columns-dropdown-facturas" class="toolbar__dropdown" hidden></div>
                    </div>
                </div>
                <div class="toolbar__right">
                    <button id="clear-selected-facturas" class="toolbar__btn toolbar__btn--danger" disabled>Quitar Seleccionados</button>
                    <button id="clear-all-facturas" class="toolbar__btn toolbar__btn--danger">Quitar Todo</button>
                    <button id="export-selected-facturas" class="toolbar__btn toolbar__btn--primary" disabled>Exportar Seleccionados</button>
                    <button id="export-all-facturas" class="toolbar__btn toolbar__btn--primary">Exportar Todo</button>
                    <button id="export-filtered-facturas" class="toolbar__btn toolbar__btn--primary">Exportar Filtrado</button>
                    <button id="print-selected-facturas" class="toolbar__btn toolbar__btn--primary" disabled>Imprimir Seleccionados</button>
                </div>
            </section>

            <section id="grid-container-facturas" class="grid-container" hidden>
                <div class="grid-wrapper">
                    <table id="data-grid-facturas" class="data-grid">
                        <thead id="grid-head-facturas"></thead>
                        <tbody id="grid-body-facturas"></tbody>
                    </table>
                </div>
            </section>

            <footer id="status-bar-facturas" class="status-bar" hidden>
                <span id="status-text-facturas"></span>
            </footer>
        </div>

        <!-- Pagos Tab -->
        <div id="tab-pagos" class="tab-content">
            <section class="toolbar" id="toolbar-pagos" hidden>
                <div class="toolbar__left">
                    <span id="row-count-pagos" class="toolbar__count"></span>
                    <div class="toolbar__columns">
                        <button id="columns-toggle-pagos" class="toolbar__btn">Filtrar Columnas</button>
                        <div id="columns-dropdown-pagos" class="toolbar__dropdown" hidden></div>
                    </div>
                </div>
                <div class="toolbar__right">
                    <button id="clear-selected-pagos" class="toolbar__btn toolbar__btn--danger" disabled>Quitar Seleccionados</button>
                    <button id="clear-all-pagos" class="toolbar__btn toolbar__btn--danger">Quitar Todo</button>
                    <button id="export-selected-pagos" class="toolbar__btn toolbar__btn--primary" disabled>Exportar Seleccionados</button>
                    <button id="export-all-pagos" class="toolbar__btn toolbar__btn--primary">Exportar Todo</button>
                    <button id="export-filtered-pagos" class="toolbar__btn toolbar__btn--primary">Exportar Filtrado</button>
                    <button id="print-selected-pagos" class="toolbar__btn toolbar__btn--primary" disabled>Imprimir Seleccionados</button>
                </div>
            </section>

            <section id="grid-container-pagos" class="grid-container" hidden>
                <div class="grid-wrapper">
                    <table id="data-grid-pagos" class="data-grid">
                        <thead id="grid-head-pagos"></thead>
                        <tbody id="grid-body-pagos"></tbody>
                    </table>
                </div>
            </section>

            <footer id="status-bar-pagos" class="status-bar" hidden>
                <span id="status-text-pagos"></span>
            </footer>
        </div>

        <div id="warnings" class="warnings" hidden></div>

        <dialog id="confirm-dialog" class="confirm-dialog">
            <p id="confirm-dialog-message" class="confirm-dialog__message"></p>
            <div class="confirm-dialog__actions">
                <button id="confirm-dialog-cancel" class="confirm-dialog__btn confirm-dialog__btn--cancel">Cancelar</button>
                <button id="confirm-dialog-ok" class="confirm-dialog__btn confirm-dialog__btn--ok">Confirmar</button>
            </div>
        </dialog>
    </div>

    <script src="lib/jspdf.umd.min.js"></script>
    <script src="lib/qrcode.min.js"></script>
    <script src="lib/jszip.min.js"></script>
    <script src="lib/xlsx.full.min.js"></script>
    <script type="module" src="js/app.js?v=2.2"></script>
</body>
</html>
